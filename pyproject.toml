[project]
name = "inventory-image-tagging"
version = "0.1.0"
description = "Project 11 Phase 1: explainable pixel and HOG clothing classifiers"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.12,<2",
  "scikit-learn>=1.5,<2",
  "scikit-image>=0.24,<1",
  "matplotlib>=3.8,<4",
  "pillow>=10,<13",
  "joblib>=1.3,<2",
  "threadpoolctl>=3,<4",
  "streamlit>=1.66.1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "nbformat>=5,<6", "nbclient>=0.10,<1"]

[tool.uv]
package = false
default-groups = ["dev", "notebook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
